<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cursor magnético</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #0e0e12;
    color: #f5f5f5;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    cursor: none;
  }
  .stage {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    flex-wrap: wrap;
  }
  .magnetic {
    position: relative;
    padding: 1.25rem 2.5rem;
    border: 1px solid #3a3a44;
    border-radius: 999px;
    font-size: 1rem;
    letter-spacing: 0.05em;
    color: #f5f5f5;
    text-decoration: none;
    transition: border-color 0.3s ease;
  }
  .magnetic:hover { border-color: #f5f5f5; }
  .cursor {
    position: fixed;
    top: 0;
    left: 0;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #f5f5f5;
    pointer-events: none;
    mix-blend-mode: difference;
    transform: translate(-50%, -50%);
    transition: width 0.25s ease, height 0.25s ease;
    z-index: 9999;
  }
  .cursor.active {
    width: 64px;
    height: 64px;
  }
</style>
</head>
<body>
  <div class="stage">
    <a href="#" class="magnetic" data-magnetic>Explorar</a>
    <a href="#" class="magnetic" data-magnetic>Contacto</a>
    <a href="#" class="magnetic" data-magnetic>Proyectos</a>
  </div>
  <div class="cursor" id="cursor"></div>

  <script>
    const cursor = document.getElementById('cursor');
    let mouseX = 0, mouseY = 0, posX = 0, posY = 0;

    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    function render() {
      posX += (mouseX - posX) * 0.18;
      posY += (mouseY - posY) * 0.18;
      cursor.style.transform = `translate(${posX}px, ${posY}px) translate(-50%, -50%)`;
      requestAnimationFrame(render);
    }
    render();

    document.querySelectorAll('[data-magnetic]').forEach((el) => {
      el.addEventListener('mouseenter', () => cursor.classList.add('active'));
      el.addEventListener('mouseleave', () => {
        cursor.classList.remove('active');
        el.style.transform = '';
      });
      el.addEventListener('mousemove', (e) => {
        const rect = el.getBoundingClientRect();
        const relX = e.clientX - rect.left - rect.width / 2;
        const relY = e.clientY - rect.top - rect.height / 2;
        el.style.transform = `translate(${relX * 0.35}px, ${relY * 0.35}px)`;
      });
    });
  </script>
</body>
</html>
